# omnibase's configuration, the smallest a host needs (as omnisense/omnibase's harness gives it: its booleans have no
# default), without any setting read from the database (the reference application's schema has no settings table),
# the storages flysystem.yaml declares.
base:
    parameter_bag:
        use_hot_bag: false
        use_setting_bag: false
    database:
        use_custom: true
    router:
        use_custom: true
    attributes:
        use_custom: true
    twig:
        use_custom: true
        use_form2: true
        use_bootstrap: true
        editor:
            storage: "local.wysiwyg"
    uploader:
        storage: "local.uploads"
    site:
        index: home
