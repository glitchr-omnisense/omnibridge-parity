framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    php_errors: {log: true}
    # The site's languages as omnibase reads them under Symfony: the default and the translator's fallbacks
    # (omnibridge/laravel's omnibridge.locales.available: en-GB, fr-FR).
    default_locale: en_GB
    translator:
        default_path: '%kernel.project_dir%/../../app/translations'
        fallbacks: [en_GB, fr_FR]
    # omnibase's forms and sign-in keep their CSRF tokens in the session (security.csrf.token_manager).
    session: true
