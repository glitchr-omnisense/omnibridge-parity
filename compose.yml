# The reference application on the four cells of the matrix host x persistence, on one MySQL database
# (database/schema.sql and seed.sql, loaded when the volume is new), and the parity suite asking every cell the same
# addresses. Each host's folder installs both persistence bridges; OMNIBRIDGE_PERSISTENCE names the one a cell runs on.
#
#   make install   # each host's Composer install, in the php image
#   make up        # MySQL, then Symfony/Doctrine :8701, Laravel/Doctrine :8702, Symfony/Eloquent :8705,
#                  # Laravel/Eloquent :8706, healthy
#   make parity    # tests/Parity against the four
#   make down      # everything stopped, the database's volume removed
name: omnibridge-parity

x-php: &php
  build: {context: ., dockerfile: docker/Dockerfile}
  image: omnibridge-parity-php
  volumes:
    - .:/srv/parity
  environment: &env
    COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    COMPOSER_CACHE_DIR: /srv/parity/var/composer-cache

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: parity
      MYSQL_USER: parity
      MYSQL_PASSWORD: parity
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysql -uparity -pparity -h127.0.0.1 parity -e "SELECT COUNT(*) FROM note" >/dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 60

  # Symfony on Doctrine (omnibridge/symfony, omnibridge/doctrine under DoctrineBundle).
  symfony:
    <<: *php
    working_dir: /srv/parity/hosts/symfony
    command: php -S 0.0.0.0:8000 -t public public/index.php
    environment: &symfony-env
      <<: *env
      OMNIBRIDGE_PERSISTENCE: doctrine
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: parity-not-a-secret
      DATABASE_URL: mysql://parity:parity@db:3306/parity?serverVersion=8.4.0&charset=utf8mb4
    ports: ['${PARITY_SYMFONY_PORT:-8701}:8000']
    depends_on: {db: {condition: service_healthy}}
    healthcheck: &web-health
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:8000/aliases']
      interval: 2s
      timeout: 10s
      retries: 30

  # Laravel on Doctrine (omnibridge/laravel's entity manager on Laravel's connection).
  laravel:
    <<: *php
    working_dir: /srv/parity/hosts/laravel
    command: php -S 0.0.0.0:8000 -t public public/index.php
    environment: &laravel-env
      <<: *env
      OMNIBRIDGE_PERSISTENCE: doctrine
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:cGFyaXR5LW5vdC1hLXNlY3JldC1wYXJpdHktbm90LWE=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: parity
      DB_USERNAME: parity
      DB_PASSWORD: parity
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    ports: ['${PARITY_LARAVEL_PORT:-8702}:8000']
    depends_on: {db: {condition: service_healthy}}
    healthcheck: *web-health

  # Symfony on Eloquent (omnibridge/symfony's base.persistence eloquent, on DoctrineBundle's PDO): the same folder
  # and vendor as `symfony`, its own container (hosts/symfony/src/Kernel.php's cache folder per persistence).
  symfony-eloquent:
    <<: *php
    working_dir: /srv/parity/hosts/symfony
    command: php -S 0.0.0.0:8000 -t public public/index.php
    environment:
      <<: *symfony-env
      OMNIBRIDGE_PERSISTENCE: eloquent
    ports: ['${PARITY_SYMFONY_ELOQUENT_PORT:-8705}:8000']
    depends_on: {db: {condition: service_healthy}}
    healthcheck: *web-health

  # Laravel on Eloquent (omnibridge/laravel's base.persistence eloquent, on Laravel's connection): the same folder and
  # vendor as `laravel`.
  laravel-eloquent:
    <<: *php
    working_dir: /srv/parity/hosts/laravel
    command: php -S 0.0.0.0:8000 -t public public/index.php
    environment:
      <<: *laravel-env
      OMNIBRIDGE_PERSISTENCE: eloquent
    ports: ['${PARITY_LARAVEL_ELOQUENT_PORT:-8706}:8000']
    depends_on: {db: {condition: service_healthy}}
    healthcheck: *web-health

  # The parity suite: every cell asked over HTTP, on the compose network; the first is the reference.
  parity:
    <<: *php
    profiles: [parity]
    working_dir: /srv/parity
    command: php vendor/bin/phpunit
    environment:
      <<: *env
      PARITY_CELLS: >-
        symfony/doctrine=http://symfony:8000
        laravel/doctrine=http://laravel:8000
        symfony/eloquent=http://symfony-eloquent:8000
        laravel/eloquent=http://laravel-eloquent:8000
    depends_on:
      symfony: {condition: service_healthy}
      laravel: {condition: service_healthy}
      symfony-eloquent: {condition: service_healthy}
      laravel-eloquent: {condition: service_healthy}
