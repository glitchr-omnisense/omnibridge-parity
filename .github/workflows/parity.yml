# The master plan's phase 4 gate and its §10 point 6, the host/ORM matrix, in CI: the reference application (app/) on
# four cells - Symfony through omnibridge/symfony and Laravel through omnibridge/laravel, each on omnibridge/doctrine and
# on omnibridge/eloquent (OMNIBRIDGE_PERSISTENCE per cell, both bridges installed in each host) - on one MySQL database
# built from database/schema.sql and seed.sql, and the parity suite (tests/Parity) asking every cell the same requests
# and comparing each with Symfony on Doctrine. The commands are the Makefile's, as run locally.
# Dependencies are resolved afresh from Packagist on each run (no lock): the stable releases the hosts' carets allow
# (omnisense/omnibase ^5.1.1, the bridges ^1.x, Composer's default stability), what a consumer installs; nightly as
# well, so that a new release of any of them shows here.
name: parity

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  parity:
    name: Symfony and Laravel, on Doctrine and on Eloquent, answer alike
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Dist archives from GitHub through the API: the job's own token lifts the anonymous rate limit (no secret).
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install both hosts (both persistence bridges) and the suite
        run: make install

      - name: Start MySQL and the four cells
        run: make up

      - name: Parity suite
        run: make parity

      - name: What ran
        if: success() || failure()
        run: |
          make versions | tee versions.txt
          { echo '### What ran'; echo; echo '```'; cat versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The hosts' logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop
        if: always()
        run: make down
